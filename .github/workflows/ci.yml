name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npx tsc -b --noEmit
        working-directory: apps/web

      # api/ sits outside tsconfig.app.json's include (src only), so the build
      # above never sees it. This is the file whose module-load failure took
      # production down — it must be type-checked explicitly.
      - run: npm run typecheck:api
        working-directory: apps/web

      # packages/jobs is outside the web project references graph; without
      # this step its sources (the ingest pipeline) are never type-checked.
      - run: npx tsc --noEmit -p packages/jobs/tsconfig.json

      # The root `npm run test` only covers apps/web; the ingest pipeline's own
      # tests (batching, fallback, input cleaning) live in packages/jobs.
      - run: npm run test --workspace=packages/jobs

      - run: npm run test

      - run: npm run build

      # E2E (playwright) stays local: it needs a live Supabase instance and there
      # is no mock-server strategy (see SPRINTS.md "Deferred / rejected").
      # Unit tests, lint, and build all run without secrets — env.ts falls back
      # to placeholder Supabase values when VITE_* vars are unset.

  # Live-schema smoke + RPC contract tests: anon REST calls against the real
  # Supabase project, asserting that every profile embed resolves and every
  # RPC's rows parse with the Zod schema the app uses. Needs SUPABASE_URL and
  # SUPABASE_ANON_KEY repo secrets, so it is skipped (not failed) on fork PRs,
  # which do not receive secrets.
  live-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npm run test:live --workspace=apps/web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
