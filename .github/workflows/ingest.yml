name: Scheduled event ingest

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npm run jobs:ingest
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INGEST_CITIES: ${{ vars.INGEST_CITIES }}
          INGEST_DAYS_AHEAD: ${{ vars.INGEST_DAYS_AHEAD }}

      - name: File issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open_issues=$(gh issue list \
            --state open \
            --search "Nightly ingest failed in:title" \
            --json number --jq length)
          if [ "$open_issues" -eq 0 ]; then
            gh issue create \
              --title "Nightly ingest failed ($(date -u +%Y-%m-%d))" \
              --body "The scheduled event ingest failed on the run starting at $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID.

Check the run log for the failing step. Common causes:
- Missing or invalid \`TICKETMASTER_API_KEY\` / \`SUPABASE_SERVICE_ROLE_KEY\`
- Ticketmaster 429/5xx exhausting retries
- Sync errors above the MAX_SYNC_ERRORS threshold (see packages/jobs/src/jobs/daily-ingest.ts)" \
              --repo "$GITHUB_REPOSITORY"
          else
            echo "An open 'Nightly ingest failed' issue already exists; not creating a duplicate."
          fi
